name: deploy the app
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: connect azure
        uses: azure/login@v4
        with:
          client-id: ${{secrets.CLIENT_ID}}
          tenant-id: ${{secrets.TENANT_ID}}
          subscription-id: ${{secrets.SUBSCRIPTION_ID}}
      - name: deploy the app
        uses: azure/webapp-deploy@v3
        with:
          app-name: app1-container
          images: ghcr.io/foundone1/dev/sampleimage@v2

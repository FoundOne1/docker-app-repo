name: Docker App
on:
  workflow_dispatch:
      inputs:
        image-version:
          required: true
          type: string
          default: "v2"
  push:
    branches:
      - feature_branch
    paths:
      - 'dockerFiles/**'
env:
  version: ${{inputs.image-version}}

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    with:
      version: $version
  test-container:
    needs: build
    uses: ./.github/workflows/container-test.yml
    with:
      username: ${{github.actor}}
      registry: ghcr.io
      registry_address: ghcr.io/foundone1/dev/sampleimage:${{ github.env.version }}
    secrets:
      password: ${{secrets.GITHUB_TOKEN}}
  test-app:
    needs: test-container
    uses: ./.github/workflows/docker-app-test.yml
  deploy-app:
    needs: test-app
    uses: ./.github/workflows/deploy-dev.yml
    with:
      version: $version
    secrets: inherit

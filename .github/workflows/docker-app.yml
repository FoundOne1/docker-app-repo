name: Docker App
on:
  push:
    branches:
      - feature_branch
    paths:
      - 'dockerFiles/**'
  
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    with:
      version: ${{github.sha}}
  test-container:
    needs: build
    uses: ./.github/workflows/container-test.yml
    with:
      username: ${{github.actor}}
      registry: ghcr.io
      registry_address: ghcr.io/foundone1/dev/sampleimage:${{github.sha}}
    secrets:
      password: ${{secrets.GITHUB_TOKEN}}
  test-app:
    needs: test-container
    uses: ./.github/workflows/docker-app-test.yml
  deploy-app:
    needs: test-app
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
    with:
      version: ${{github.sha}}

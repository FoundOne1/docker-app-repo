name: production deployment
description: deploy the dev app to the production
on:
  push: 
    branches: [main]
    paths:
      - "dockerFiles/**"
  workflow_dispatch:

permissions:
  packages: write
  contents: write
  id-token: write
env:
  version: ${{github.sha}}

jobs:
  tag-prod-container:
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
          registry: ghcr.io
      - name: pull and tag the image
        run: |
          docker pull ghcr.io/foundone1/dev/devimage:latest
          docker tag ghcr.io/foundone1/dev/devimage:latest ghcr.io/foundone1/prod/prodimage:${{env.version}}
      - name: push the prod image
        run: |
          docker push ghcr.io/foundone1/prod/prodimage:${{env.version}}
      - name: login to azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}
      - name: azure container apps deployment
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: app2-prod
          registryServer: ghcr.io
          registryUsername: ${{github.actor}}
          registryPassword: ${{secrets.GITHUB_TOKEN}}
          imageToDeploy: ghcr.io/foundone1/prod/prodimage:${{env.version}}
          resourceGroup: grp2
          containerAppEnvironment: managedEnvironment-grp2-860a
          ingress: external
          targetPort: 80
          environmentVariables: ENVIRONMENT=PROD APP_VERSION=${{env.version}}

        
      

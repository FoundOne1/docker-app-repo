name: docker app test
description: it will test the app and the container

on:
 workflow_dispatch:
 workflow_call:
env:
 port: 3000
jobs:
  test:
   runs-on: ubuntu-latest
   services:
     dev-app:
      image: ghcr.io/foundone1/dev/sampleimage:v2
      ports:
        - 3000:3000
   steps:
    - name: test the container-app
      run: |
       server=$(hostname)
       sleep 5
       curl -v http://$server:3000/health
      

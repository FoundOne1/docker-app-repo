# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app1-container

on:
  push:
    branches:
      - feature_branch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_17FA0B6004214B1BAC4B030573A63C1B }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_368A59E885674D17BEC4571C9714349B }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_17FA0B6004214B1BAC4B030573A63C1B }}/ghcr.io/foundone1/dev/sampleimage:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_040B0243DB5A4A0BAEF00F99D621E4AB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7ABFCBB3B93B4D3AB35B345574B5EFF1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D227546FB52C448D940FAD10044D718E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app1-container'
          slot-name: 'Production'
          images: 'ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_17FA0B6004214B1BAC4B030573A63C1B }}/ghcr.io/foundone1/dev/sampleimage:${{ github.sha }}'
          
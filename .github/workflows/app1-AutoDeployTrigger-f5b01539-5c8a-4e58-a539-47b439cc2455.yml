name: Trigger auto deployment for app1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feature_branch ]
    paths:
    - '**'
    - '.github/workflows/app1-AutoDeployTrigger-f5b01539-5c8a-4e58-a539-47b439cc2455.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.APP1_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/dockerFiles
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.APP1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APP1_REGISTRY_PASSWORD }}
          containerAppName: app1
          resourceGroup: grp2
          imageToBuild: ghcr.io/foundone1/dev/sampleimage:${{ github.sha }}
          
            

     


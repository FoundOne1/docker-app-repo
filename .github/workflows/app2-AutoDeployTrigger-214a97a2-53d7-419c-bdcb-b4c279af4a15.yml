name: Trigger auto deployment for app2

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ feature_branch ]
    paths:
    - '**'
    - '.github/workflows/app2-AutoDeployTrigger-214a97a2-53d7-419c-bdcb-b4c279af4a15.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APP2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APP2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APP2_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/dockerFiles
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.APP2_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APP2_REGISTRY_PASSWORD }}
          containerAppName: app2
          resourceGroup: grp2
          imageToBuild: ghcr.io/app2:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



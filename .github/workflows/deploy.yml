name: deploy the app
on:
  # workflow_call:
  #   inputs:
  #     msg:
  #       type: string
  #       required: false
  workflow_run:
    workflows: [Docker App]
    types: completed
        
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: check the values
        run: |
          echo ${{secrets.CLIENT_ID}}
          echo ${{secrets.TENANT_ID}}
      - name: connect azure
        uses: azure/login@v2
        with:
          client-id: ${{secrets.CLIENT_ID}}
          tenant-id: ${{secrets.TENANT_ID}}
          subscription-id: ${{secrets.SUBSCRIPTION_ID}}
      - name: deploy the app
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: app1-container
          appSourcePath: ${{github.workspace}}
          registry: ghcr.io
          images: ghcr.io/foundone1/dev/sampleimage@v2
          resourceGroup: grp2

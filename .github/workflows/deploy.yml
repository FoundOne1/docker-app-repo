name: deploy the app
on:
  workflow_dispatch:
  workflow_call:
    

permissions:
  id-token: write
  contents: write
  packages: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: connect azure
        uses: azure/login@v2
        with:
          client-id: ${{secrets.CLIENT_ID}}
          tenant-id: ${{secrets.TENANT_ID}}
          subscription-id: ${{secrets.SUBSCRIPTION_ID}}
      - name: deploy the app
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: app2
          registryUrl: ghcr.io
          imageToDeploy: ghcr.io/foundone1/dev/sampleimage:v2
          resourceGroup: grp2
          containerAppEnvironment: managedEnvironment-grp2-860a
